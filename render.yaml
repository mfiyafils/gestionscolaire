# ══════════════════════════════════════════════════════════════════════
# Scolaria — Render Blueprint (Web Service Node.js)
# Déploiement depuis un dépôt Git (GitHub/GitLab) : New → Blueprint → ce fichier.
# Aucune variable n'est obligatoire : sans DATABASE_URL l'application
# démarre sur sa base embarquée PGlite (le build ne peut pas échouer).
# ══════════════════════════════════════════════════════════════════════
services:
  - type: web
    name: scolaria
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    # server.js écoute sur 0.0.0.0 et sur process.env.PORT (injecté par Render)
    # avec repli 10000 → aucun "Port scan timeout reached".
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Base PostgreSQL gérée (optionnelle).
      # → Renseignez cette variable dans le dashboard Render (Internal Database URL)
      #   en pointant sur le service "scolaria-db" ci-dessous, ou sur Neon/Supabase.
      # → Si elle reste vide, l'application utilise automatiquement PGlite (fallback) :
      #   aucune erreur de build ni de démarrage.
      - key: DATABASE_URL
        sync: false
      # Compte Super Admin (privé, jamais exposé aux abonnés).
      - key: ADMIN_EMAIL
        value: etsmfiyafils@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      # Optionnel : clé OpenAI pour enrichir l'Agent IA de code.
      - key: OPENAI_API_KEY
        sync: false

# ── PostgreSQL managé (décommentez pour l'activer) ─────────────────────
